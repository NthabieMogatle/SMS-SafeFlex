<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 72" role="img" aria-label="Elevra">
  <title>Elevra</title>
  <desc>Elevra wordmark — light variant for dark backgrounds.</desc>
  <!-- Power-button glyph -->
  <g transform="translate(8 16)" stroke="#22D3EE" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M 12 9 A 16 16 0 1 0 32 9" />
    <line x1="22" y1="2" x2="22" y2="22" />
  </g>
  <!-- Wordmark -->
  <text x="64" y="48"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="32" letter-spacing="-0.02em">
    <tspan font-weight="500" fill="#FFFFFF">Elev</tspan><tspan font-weight="800" fill="#22D3EE">ra</tspan>
  </text>
</svg>
