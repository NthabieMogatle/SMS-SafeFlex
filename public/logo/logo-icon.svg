<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="AI Mock Interview Coach">
  <title>AI Mock Interview Coach</title>
  <desc>AI Mock Interview Coach square icon — power-button glyph above 'AI' wordmark on dark navy.</desc>
  <!-- Background -->
  <rect width="1024" height="1024" rx="208" fill="#0A0E1A" />
  <!-- Power-button glyph, centered horizontally, upper portion -->
  <g transform="translate(512 410)" stroke="#22D3EE" stroke-width="46" stroke-linecap="round" fill="none">
    <path d="M -50 -174 A 180 180 0 1 0 50 -174" />
    <line x1="0" y1="-220" x2="0" y2="0" />
  </g>
  <!-- "AI" wordmark, lower portion -->
  <text x="512" y="900"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="240" font-weight="800" fill="#22D3EE" letter-spacing="-0.04em">AI</text>
</svg>
